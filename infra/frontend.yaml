AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry frontend on CloudFront: a private S3 bucket holding the Next.js static
  export, reachable only through the distribution. Deployed by
  scripts/deploy-frontend.sh, which builds the site and syncs it into the bucket.

  Optionally on a custom domain (make domain DOMAIN=app.example.com): the
  distribution takes the alias and an ACM certificate from us-east-1. Only the
  frontend takes a custom domain; the API stays on its Lambda function URL.

  Built to stay free: CloudFront's always-free tier covers 1 TB/month out and
  10M requests, and nothing here uses a paid extra (no WAF, logging, Lambda@Edge,
  Origin Shield or dedicated IP). CloudFront Functions get 2M invocations free
  a month, and each deploy uses one of the 1,000 free invalidation paths.

Parameters:
  ProjectName:
    Type: String
    Default: spry

  DefaultRootObject:
    Type: String
    Default: index.html

  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional custom domain, e.g. app.example.com. Managed by
      scripts/domain-frontend.sh (make domain).

  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 zone holding DomainName. Set, the stack owns the alias records
      pointing at the distribution; empty, you create them wherever DNS lives.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate for DomainName. CloudFront only accepts certificates from
      us-east-1. `make cert` fills this in.

Conditions:
  # A domain without a certificate is ignored rather than half-applied.
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]
  # Only then can the stack own the DNS records itself.
  HasHostedZone: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # Private: no public access, no website endpoint. CloudFront reaches it with
  # a signed request through the origin access control below.
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                # Scoped to this distribution, so no other account's
                # distribution can point at the bucket.
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # A static export puts /items at items.html, but the browser asks for /items.
  # S3 has no notion of "try adding .html", so the rewrite happens at the edge.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-frontend-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map clean URLs onto the static export's file names
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/') {
            request.uri = '/index.html';
          } else if (uri.endsWith('/')) {
            // The export writes items.html, not items/index.html.
            request.uri = uri.slice(0, -1) + '.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} frontend"
        DefaultRootObject: !Ref DefaultRootObject
        # North America + Europe: the cheapest edges, should traffic ever
        # outgrow the free tier.
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honours the Cache-Control the deploy
          # script puts on each object, so hashed assets pin and HTML does not.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # With origin access control a missing key comes back as 403, not 404.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Alias records are free, resolve straight to CloudFront and, unlike a CNAME,
  # may sit on a zone apex.
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Every CloudFront distribution lives in this one zone.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: The custom domain when there is one, else the cloudfront.net name.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"

  BucketName:
    Value: !Ref Bucket

  DistributionId:
    Value: !Ref Distribution

  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
